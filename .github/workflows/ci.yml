name: ci

# Rule ids this workflow enforces: R6 (publishable content - no-secret-scan), R7 (hermetic by
# default: no install step, no key, no network), R10 (clean tree - contract-gate). The ids are
# named here on purpose: tests/test_harness_selfcheck.py checks that every rule is either enforced
# by code or explicitly marked manual, so a rule cannot claim enforcement it does not have.

on:
  push:
    branches: [main]
  pull_request:

# CI must stay hermetic (no API key, no model server): pin both stages to the offline
# deterministic backends. The delivered service leaves these unset and uses the real providers
# from configs/retrieval.json (BGE-M3 embeddings + cross-encoder reranker, both keyless, served
# locally via scripts/setup_models.py).
env:
  RAGSERVE_EMBEDDING_PROVIDER: deterministic
  RAGSERVE_RERANKER_PROVIDER: deterministic

jobs:
  hermetic-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: No third-party packages needed
        run: python -c "import sys; print(sys.version)"

      - name: Run hermetic test suite
        run: python scripts/run_tests.py -v

  no-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject internal classification markers
        shell: bash
        run: |
          set -euo pipefail
          # The repository must stay publishable: fail if internal classification
          # marker SHAPES appear in tracked content. Patterns below intentionally
          # match the generic shapes only, so this file itself never contains a
          # company name.
          #   shape 1: "[<Word> - INTERNAL]" style footer marks
          #   shape 2: Microsoft Information Protection label properties
          if git grep -nIEi '\[[A-Za-z0-9]+ - (INTERNAL|RESTRICTED|CONFIDENTIAL)\]|MSIP_Label_[0-9a-f-]{36}_' -- . ; then
            echo "::error::internal classification marker shape found in tracked content"
            exit 1
          fi
          echo "clean"
