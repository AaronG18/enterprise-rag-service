name: harness

# The harness gate: every branch push and every pull request.
#
# This workflow enforces the rules that harness/RULES.md states in prose - issue traceability,
# evidence in the PR body, no scratch files, publishable content, and every requirement row in
# harness/requirements.toml verified. A rule that only exists in a document is a rule that fails
# exactly when attention is lowest, so the enforceable ones live here.
#
# Rule ids this workflow enforces: R1 (issue in branch name and every commit), R14 (branch and PR,
# never straight to main), R15 (the harness checks are the definition of done), R16 (the gate is
# code and needs its own tests), R17 (no front end - the selfcheck runs in this job), R18 (a
# capability is proven by its hardest input - the fixture tests run here), R19 (evidence lives in
# the repository - this job checks that the committed corpus is tracked, not gitignored, and not a
# folder of stubs), R20 (the deliverable is what the brief asks for - the selfcheck asserts that
# scripts/ holds exactly one entry point) and R22 (a document may not name what does not exist - the
# selfcheck scans every tracked document for dead script names).
#
# The rule ids are named here on purpose: the traceability check in
# tests/test_harness_selfcheck.py looks for them, so a rule cannot claim enforcement it does not
# have. Since R19's lesson, that check also fails when a rule is added without being named in any
# workflow - adding a rule without touching CI is a red build, not a silent promise.

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
    # "edited" matters: pr-hygiene checks the pull request body, so a body edit has to
    # re-run the check. Without it, a body that failed the evidence rule could be fixed
    # without ever being checked again.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# CI must stay hermetic (no API key, no model server): pin both stages to the offline
# deterministic backends. The delivered service leaves these unset and uses the real providers
# from configs/retrieval.json (BGE-M3 embeddings + cross-encoder reranker, both keyless, served
# locally via scripts/run.py).
env:
  RAGSERVE_EMBEDDING_PROVIDER: deterministic
  RAGSERVE_RERANKER_PROVIDER: deterministic

jobs:
  requirements-gate:
    name: requirements-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: No third-party packages needed
        run: python -c "import sys; print(sys.version)"

      - name: Verify every requirement row
        run: python scripts/run.py --verify

      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirements-verification-${{ github.sha }}
          path: artifacts/verify/
          retention-days: 30

  contract-gate:
    name: contract-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tree hygiene - no scratch or temp files
        run: |
          set -euo pipefail
          # R10: scratch scripts are deleted before the commit. These shapes are the ones that
          # actually leaked during development (a commit-message file in the repo root).
          if git grep -nIE '^(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,})' -- . ; then
            echo "::error::credential-shaped string in tracked content"
            exit 1
          fi
          # The second character must not be an underscore: otherwise `__init__.py` matches
          # (a leading `_` plus `[^/]*`), and the gate fails on a legitimate package marker.
          # Found by the gate itself during the SUB 59 demo.
          offenders=$(git ls-files | grep -E '(^|/)_[^_/][^/]*\.(py|txt|json)$|(^|/)scratch/|\.tmp$|^_msg\.txt$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::scratch files tracked: $offenders"
            exit 1
          fi
          echo "tree clean"

      - name: Publishable content - no classification marker shapes
        run: |
          set -euo pipefail
          if git grep -nIEi '\[[A-Za-z0-9]+ - (INTERNAL|RESTRICTED|CONFIDENTIAL)\]|MSIP_Label_[0-9a-f-]{36}_' -- . ; then
            echo "::error::internal classification marker shape found"
            exit 1
          fi
          echo "clean"

      - name: Committed test data (R19)
        run: |
          set -euo pipefail
          # R19: the review corpus must actually live in the repository. A test cannot see
          # .gitignore, and a local checkout hides a corpus that was never committed - so this
          # checks the index, not the working tree.
          python - <<'PY'
          import os, subprocess, sys
          files = subprocess.run(["git", "ls-files", "tests/data/review-corpus"],
                                 capture_output=True, text=True).stdout.split()
          pdfs = [f for f in files if f.endswith(".pdf")]
          total = sum(os.path.getsize(f) for f in pdfs)
          print("tracked corpus files: %d (pdfs %d), bytes: %d" % (len(files), len(pdfs), total))
          ok = len(pdfs) >= 30 and total >= 300_000
          if not ok:
              print("::error::the review corpus is not committed, or has shrunk to stubs")
          if subprocess.run(["git", "check-ignore", "-q",
                             "tests/data/review-corpus/manifest.json"]).returncode == 0:
              print("::error::tests/data/review-corpus is gitignored")
              ok = False
          if "manifest.json" not in [os.path.basename(f) for f in files]:
              print("::error::tests/data/review-corpus/manifest.json is not tracked")
              ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Hermetic test suite
        run: python scripts/run.py --test

      - name: Hermetic - no third-party imports in shipped code
        run: |
          set -euo pipefail
          # R7: the default path must run on a cold clone with no package index access.
          python - <<'PY'
          import ast, pathlib, sys
          allowed_roots = set(sys.stdlib_module_names) | {"ragserve"}
          offenders = []
          for path in pathlib.Path("src").rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [alias.name.split(".")[0] for alias in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module and node.level == 0:
                      names = [node.module.split(".")[0]]
                  else:
                      continue
                  for name in names:
                      if name not in allowed_roots:
                          offenders.append("%s imports %s" % (path, name))
          if offenders:
              print("\n".join(offenders))
              sys.exit(1)
          print("shipped code uses the standard library and ragserve only")
          PY

  pr-hygiene:
    name: pr-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Branch name carries an issue number
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if ! echo "$HEAD_REF" | grep -Eq '^[a-z]+/[0-9]+-[a-z0-9-]+$'; then
            echo "::error::branch '$HEAD_REF' must look like <type>/<issue>-<slug>, e.g. feature/57-cache-eviction"
            exit 1
          fi
          echo "branch name ok: $HEAD_REF"

      - name: Every commit references an issue
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # On a PR, compare against the base branch. On a branch push, compare against the
          # merge-base with main, so only the commits this branch introduces are checked -
          # history written before the rule existed is not this change's fault.
          if [ -n "${BASE_SHA:-}" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            base=$(git merge-base origin/main HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD | head -1)
            range="$base..HEAD"
          fi
          missing=0
          # Merge commits are exempt: their message is generated by git, not written by a
          # person, so demanding an issue reference there blocks ordinary `git merge` work.
          # Found by the SUB 59 demo, where merging main into the branch turned pr-hygiene red.
          for sha in $(git rev-list --no-merges "$range"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! echo "$subject" | grep -Eq '^#[0-9]+[ :]'; then
              echo "::error::commit ${sha:0:7} does not start with an issue reference: $subject"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "every commit on this change references an issue"

      - name: PR body carries the evidence block
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          fail=0
          # These are case-insensitive substring checks, not heading checks: the point is that the
          # body carries the evidence at all, not that the headings are spelled a particular way.
          # .github/PULL_REQUEST_TEMPLATE.md satisfies all three on purpose (guarded by
          # tests/test_pr_hygiene.py), so a PR started from the template passes this step.
          for needle in "## Evidence" "Commands" "provenance"; do
            if ! echo "$PR_BODY" | grep -qi "$needle"; then
              echo "::error::PR body does not contain '$needle' (case-insensitive substring) - required by harness/RULES.md R2. Add a section whose text contains it; .github/PULL_REQUEST_TEMPLATE.md already does."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "PR body carries the evidence block"
