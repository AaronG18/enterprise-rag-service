# Machine-readable verification manifest.
#
# docs/REQUIREMENTS.md is the human-readable matrix (why each row exists); this file is what CI
# executes. Every row must carry the same ID, so the two cannot drift - a contract test asserts
# that every ID in the matrix has a row here and vice versa.
#
# kinds:
#   command  run a command, require exit code 0
#   test     run a test selection, require exit code 0
#   file     assert a path exists (optionally containing a string)
#   metric   read a metric from a generated artefact and compare it to a bound

[generators]
# Run once per verification; every metric row reads from these artefacts, so nothing is
# re-measured twice and no row can read a stale file.
eval = "python scripts/run_eval.py --all"
bench = "python scripts/run_bench.py --http --concurrency 5 --requests 30 --assert"
diagnose = "python scripts/diagnose.py --all --assert"

[artifacts]
# Relative to artifacts/; the newest run directory is used.
eval = "eval/*/metrics.json"
bench = "bench/*/bench.json"
diagnosis = "diagnosis/*/report.json"

# ---------------------------------------------------------------- global constraints
[[requirement]]
id = "R-01"
title = "90% of QA requests within 10 s, measured at the R-02 concurrency"
kind = "metric"
artifact = "bench"
metric = "p90_latency_ms"
op = "<="
bound = 10000
owner = "#7"

[[requirement]]
id = "R-02"
title = ">= 5 concurrent requests on a single instance, no errors"
kind = "metric"
artifact = "bench"
metric = "errors"
op = "=="
bound = 0
owner = "#7"

[[requirement]]
id = "R-03"
title = "token cost per 1,000 calls with a stated price list"
kind = "file"
path = "src/ragserve/evaluation/cost.py"
contains = "cost_per_1000_calls"
owner = "#7"
note = "The arithmetic is verified here; the monetary value needs a price list the operator must supply, so the repository refuses to print one (documented, not silently skipped)."

[[requirement]]
id = "R-04"
title = "model-version selection rationale with explicit trade-offs"
kind = "file"
path = "docs/adr/0004-model-version-tradeoff.md"
contains = "hy3"
owner = "#7"

[[requirement]]
id = "R-05"
title = "structured logs sufficient for monitoring and diagnosis"
kind = "test"
tests = ["TestStructuredLogger", "TestServiceLogging"]
owner = "#5"

[[requirement]]
id = "R-06"
title = "minimal prompt-injection defense"
kind = "test"
run = "python scripts/run_tests.py -k TestInjectionDefence"
owner = "#4"

[[requirement]]
id = "R-07"
title = "PII redacted in answers and in log records"
kind = "test"
tests = ["TestPiiRedaction", "TestRedactionOfLogRecords"]
owner = "#4"

[[requirement]]
id = "R-08"
title = "answers strictly grounded to retrieved context"
kind = "test"
run = "python scripts/run_tests.py -k TestGrounding"
owner = "#4"

# ------------------------------------------------------------ functional requirements
[[requirement]]
id = "R-09"
title = "vector-only and hybrid modes both selectable and measurably different"
kind = "test"
tests = ["TestModesAreConfigDriven", "TestVectorRetrieval", "TestHybridAndFusion"]
owner = "#3"

[[requirement]]
id = "R-10"
