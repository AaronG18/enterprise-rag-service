# ------------------------------------------------------- model-backed lane (documented)
# The real-generation numbers cannot be produced in CI (they need credentials), so the gate
# asserts the committed snapshot of the model-backed run: docs/eval/model-backed-metrics.json.
# That is a documented limitation with a machine-checkable substitute, not a skipped requirement.
[[requirement]]
id = "R-14m"
title = "model-backed faithfulness >= 0.85"
kind = "metric"
path = "docs/eval/model-backed-metrics.json"
config = "hy3 | hybrid"
metric = "faithfulness"
op = ">="
bound = 0.85
owner = "#6"

[[requirement]]
id = "R-16m"
